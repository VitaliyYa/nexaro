name: CI/CD

on:
  push:
    branches: [ "main", "feat/*", "fix/*" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/smartrent-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/smartrent-frontend

jobs:
  # ===========================================================================
  # CI: Lint and test (runs on every push and PR)
  # ===========================================================================
  backend-checks:
    name: Backend Lint and Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format --check .

      - name: Run Pytest
        run: uv run pytest

  frontend-checks:
    name: Frontend Lint, Build, and Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate TypeScript types from JSON Schemas
        run: npm run codegen:types

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check and Vite build
        run: npm run build

      - name: Run Unit Tests (Vitest)
        run: npm run test:unit

  # ===========================================================================
  # CD: Build Docker images and push to GHCR (only on main)
  # ===========================================================================
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend-checks, frontend-checks]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_API_BASE_URL=/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # CD: Deploy to VPS via SSH (only on main, after images are built)
  # ===========================================================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build-and-push]
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          # Image references
          GHCR_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: latest
          # Backend .env variables
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_JWKS_URL: ${{ secrets.SUPABASE_JWKS_URL }}
          MQTT_BROKER_HOST: ${{ secrets.MQTT_BROKER_HOST }}
          MQTT_WORKER_USERNAME: backend_worker
          MQTT_WORKER_PASSWORD: ${{ secrets.MQTT_WORKER_PASSWORD }}
          PIN_ENCRYPTION_KEY: ${{ secrets.PIN_ENCRYPTION_KEY }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          MQTT_CERT_DOMAIN: ${{ secrets.MQTT_CERT_DOMAIN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_OWNER,IMAGE_TAG,SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,SUPABASE_SECRET_KEY,SUPABASE_JWKS_URL,MQTT_BROKER_HOST,MQTT_WORKER_USERNAME,MQTT_WORKER_PASSWORD,PIN_ENCRYPTION_KEY,CORS_ORIGINS,CLOUDFLARE_API_TOKEN,APP_DOMAIN,MQTT_CERT_DOMAIN
          script: |
            set -e

            DEPLOY_DIR="$HOME/smartrent"
            mkdir -p "$DEPLOY_DIR/deploy/nginx" "$DEPLOY_DIR/deploy/mosquitto" "$DEPLOY_DIR/deploy/certbot"

            # Generate .env from secrets
            cat > "$DEPLOY_DIR/.env" << ENVEOF
            ENVIRONMENT=production
            DEBUG=false
            GHCR_OWNER=${GHCR_OWNER}
            IMAGE_TAG=${IMAGE_TAG}
            SUPABASE_URL=${SUPABASE_URL}
            SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
            SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
            SUPABASE_JWKS_URL=${SUPABASE_JWKS_URL}
            MQTT_BROKER_HOST=${MQTT_BROKER_HOST}
            MQTT_BROKER_PORT=8883
            MQTT_TLS_ENABLED=true
            MQTT_WORKER_USERNAME=${MQTT_WORKER_USERNAME}
            MQTT_WORKER_PASSWORD=${MQTT_WORKER_PASSWORD}
            MQTT_KEEPALIVE=60
            PIN_ENCRYPTION_KEY=${PIN_ENCRYPTION_KEY}
            CORS_ORIGINS=${CORS_ORIGINS}
            ENVEOF

            # Generate Cloudflare credentials for Certbot
            cat > "$DEPLOY_DIR/deploy/certbot/cloudflare.ini" << CFEOF
            dns_cloudflare_api_token = ${CLOUDFLARE_API_TOKEN}
            CFEOF
            chmod 600 "$DEPLOY_DIR/deploy/certbot/cloudflare.ini"

      - name: Copy deployment files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml,deploy/nginx/nginx.conf,deploy/mosquitto/mosquitto.prod.conf"
          target: "$HOME/smartrent"
          overwrite: true

      - name: Replace domain placeholders and start services
        uses: appleboy/ssh-action@v1
        env:
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          MQTT_CERT_DOMAIN: ${{ secrets.MQTT_CERT_DOMAIN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: APP_DOMAIN,MQTT_CERT_DOMAIN
          script: |
            set -e

            DEPLOY_DIR="$HOME/smartrent"
            cd "$DEPLOY_DIR"

            # Replace domain placeholders in config files
            sed -i "s|__APP_DOMAIN__|${APP_DOMAIN}|g" deploy/nginx/nginx.conf
            sed -i "s|__MQTT_CERT_DOMAIN__|${MQTT_CERT_DOMAIN}|g" deploy/mosquitto/mosquitto.prod.conf

            # Log in to GHCR (needed if repo goes private)
            # echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Pull latest images and restart
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Wait for backend health check
            echo "Waiting for backend to become healthy..."
            for i in $(seq 1 30); do
              if docker compose -f docker-compose.prod.yml exec -T backend curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                echo "Backend is healthy!"
                break
              fi
              if [ "$i" = "30" ]; then
                echo "Backend health check failed after 30 attempts"
                docker compose -f docker-compose.prod.yml logs backend --tail 50
                exit 1
              fi
              sleep 2
            done

            # Show running containers
            docker compose -f docker-compose.prod.yml ps
