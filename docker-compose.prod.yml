# =============================================================================
# SmartRent Production Docker Compose
# =============================================================================
# Orchestrates all services on a single VPS:
#   - backend:   FastAPI API server + MQTT Worker
#   - mosquitto: MQTT broker with mosquitto-go-auth (HTTP webhooks → backend)
#   - frontend:  Nginx serving Vue 3 SPA static files
#   - nginx:     Reverse proxy with TLS termination (Let's Encrypt)
#   - certbot:   Automated certificate renewal via Cloudflare DNS challenge
#
# Usage:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Backend: FastAPI + MQTT Worker
  # ---------------------------------------------------------------------------
  backend:
    image: ghcr.io/${GHCR_OWNER:-smartrent}/smartrent-backend:${IMAGE_TAG:-latest}
    container_name: smartrent-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
    networks:
      - smartrent
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ---------------------------------------------------------------------------
  # Mosquitto: MQTT Broker with dynamic auth via Backend webhooks (ADR 6)
  # ---------------------------------------------------------------------------
  mosquitto:
    image: iegomez/mosquitto-go-auth:latest
    container_name: smartrent-mosquitto
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8883:8883"
    volumes:
      - ./deploy/mosquitto/mosquitto.prod.conf:/etc/mosquitto/mosquitto.conf:ro
      - certbot-certs:/etc/mosquitto/certs:ro
      - mosquitto-data:/var/lib/mosquitto
    environment:
      - TZ=UTC
    networks:
      - smartrent

  # ---------------------------------------------------------------------------
  # Frontend: Nginx serving compiled Vue 3 SPA
  # ---------------------------------------------------------------------------
  frontend:
    image: ghcr.io/${GHCR_OWNER:-smartrent}/smartrent-frontend:${IMAGE_TAG:-latest}
    container_name: smartrent-frontend
    restart: unless-stopped
    networks:
      - smartrent

  # ---------------------------------------------------------------------------
  # Nginx: Reverse proxy with HTTPS (Let's Encrypt TLS termination)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1-alpine
    container_name: smartrent-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    networks:
      - smartrent

  # ---------------------------------------------------------------------------
  # Certbot: Automated certificate renewal (Cloudflare DNS challenge)
  # ---------------------------------------------------------------------------
  certbot:
    image: certbot/dns-cloudflare:latest
    container_name: smartrent-certbot
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
      - ./deploy/certbot/cloudflare.ini:/etc/letsencrypt/cloudflare.ini:ro
    # Renew certificates every 12 hours (certbot only renews if < 30 days remain)
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 43200; done'"
    networks:
      - smartrent

# =============================================================================
# Shared resources
# =============================================================================
networks:
  smartrent:
    driver: bridge

volumes:
  mosquitto-data:
    driver: local
  certbot-certs:
    driver: local
  certbot-webroot:
    driver: local
