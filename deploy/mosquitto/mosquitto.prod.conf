# Mosquitto MQTT Broker — Production Configuration for SmartRent
# ================================================================
# Uses mosquitto-go-auth with HTTP webhooks delegating authentication
# and ACL checks to the FastAPI Backend via internal Docker DNS.
# TLS certificates are provided by Let's Encrypt (Certbot).
#
# NOTE: __MQTT_CERT_DOMAIN__ is replaced by the CD pipeline with the
# actual MQTT domain before deploying to the VPS.

# General Configuration
persistence true
persistence_location /var/lib/mosquitto/
log_dest stdout

# Authentication & Access Control (mosquitto-go-auth HTTP Plugin)
allow_anonymous false

# Dynamic Authentication Plugin (mosquitto-go-auth)
auth_plugin /mosquitto/go-auth.so
auth_opt_backends http
auth_opt_check_prefixes false

# HTTP Auth Endpoints (FastAPI Backend via Docker internal network)
auth_opt_http_host backend
auth_opt_http_port 8000
auth_opt_http_getuser_uri /api/v1/auth/mqtt/user
auth_opt_http_superuser_uri /api/v1/auth/mqtt/superuser
auth_opt_http_aclcheck_uri /api/v1/auth/mqtt/acl
auth_opt_http_params_mode json
auth_opt_http_with_tls false
auth_opt_http_timeout 5

# Connection Limits & Keepalive
max_keepalive 120
max_connections 10000
max_queued_messages 1000

# ---------------------------------------------------
# Primary Listener: Secure MQTT over TLS (Port 8883)
# ---------------------------------------------------
listener 8883 0.0.0.0
protocol mqtt

# TLS Configuration (Let's Encrypt certificates via shared Docker volume)
# certbot-certs volume is mounted at /etc/mosquitto/certs = /etc/letsencrypt
cafile /etc/mosquitto/certs/live/__MQTT_CERT_DOMAIN__/chain.pem
certfile /etc/mosquitto/certs/live/__MQTT_CERT_DOMAIN__/fullchain.pem
keyfile /etc/mosquitto/certs/live/__MQTT_CERT_DOMAIN__/privkey.pem
tls_version tlsv1.2
