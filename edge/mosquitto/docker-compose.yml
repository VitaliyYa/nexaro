services:
  mosquitto:
    image: iegomez/mosquitto-go-auth:latest
    container_name: smartrent-mosquitto
    restart: unless-stopped
    ports:
      - "8883:8883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    environment:
      - TZ=UTC
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 8883 --cafile /mosquitto/certs/ca.crt -u healthcheck -P healthcheck -t healthcheck -E -i healthcheck-probe || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mosquitto-data:
    driver: local
  mosquitto-log:
    driver: local
