services:
  mosquitto:
    image: iegomez/mosquitto-go-auth:latest
    container_name: smartrent-mosquitto
    restart: unless-stopped
    ports:
      - "8883:8883"
      - "9001:9001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./mosquitto.conf:/etc/mosquitto/mosquitto.conf:ro
      - ./certs:/etc/mosquitto/certs:ro
      - mosquitto-data:/var/lib/mosquitto
      - mosquitto-log:/var/log/mosquitto
    env_file:
      - path: ../../.env
        required: false
      - path: .env
        required: false
    environment:
      - TZ=UTC
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 8883 --cafile /etc/mosquitto/certs/ca.crt -u \"$${MQTT_WORKER_USERNAME}\" -P \"$${MQTT_WORKER_PASSWORD}\" -t healthcheck -E -i healthcheck-probe || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3




volumes:
  mosquitto-data:
    driver: local
  mosquitto-log:
    driver: local
