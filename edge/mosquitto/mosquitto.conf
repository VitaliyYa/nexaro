# Mosquitto MQTT Broker Configuration for SmartRent
# ===================================================

# General Configuration
persistence true
persistence_location /var/lib/mosquitto/
log_dest stdout

# Authentication & Access Control (mosquitto-go-auth HTTP Plugin)
allow_anonymous false

# Dynamic Authentication Plugin (mosquitto-go-auth)
auth_plugin /mosquitto/go-auth.so
auth_opt_backends http
auth_opt_check_prefixes false

# HTTP Auth Endpoints (FastAPI Backend on Host)
auth_opt_http_host host.docker.internal
auth_opt_http_port 8000
auth_opt_http_getuser_uri /api/v1/auth/mqtt/user
auth_opt_http_superuser_uri /api/v1/auth/mqtt/superuser
auth_opt_http_aclcheck_uri /api/v1/auth/mqtt/acl
auth_opt_http_params_mode json
auth_opt_http_with_tls false
auth_opt_http_timeout 5


# Connection Limits & Keepalive
max_keepalive 120
max_connections 10000
max_queued_messages 1000

# ---------------------------------------------------
# Primary Listener: Secure MQTT over TLS (Port 8883)
# ---------------------------------------------------
listener 8883 0.0.0.0
protocol mqtt

# TLS Configuration
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key
tls_version tlsv1.2

# ---------------------------------------------------
# Secondary Listener: Secure WebSockets (Port 9001)
# ---------------------------------------------------
listener 9001 0.0.0.0
protocol websockets

# TLS Configuration for WebSockets
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key
tls_version tlsv1.2

