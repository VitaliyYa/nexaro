# Mosquitto MQTT Broker Configuration for SmartRent
# ===================================================

# General Configuration
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Authentication & Access Control (mosquitto-go-auth HTTP Plugin)
allow_anonymous false

# Dynamic Authentication Plugin (mosquitto-go-auth)
auth_plugin /mosquitto/go-auth.so
auth_opt_backends http
auth_opt_check_prefixes false

# HTTP Auth Endpoints (FastAPI Backend)
auth_opt_http_host backend
auth_opt_http_port 8000
auth_opt_http_getuser_uri /api/v1/mqtt-auth/user
auth_opt_http_superuser_uri /api/v1/mqtt-auth/superuser
auth_opt_http_aclcheck_uri /api/v1/mqtt-auth/acl
auth_opt_http_with_tls false
auth_opt_http_timeout 5

# Connection Limits & Keepalive
max_keepalive 120
max_connections 10000
max_queued_messages 1000

# ---------------------------------------------------
# Primary Listener: Secure MQTT over TLS (Port 8883)
# ---------------------------------------------------
listener 8883 0.0.0.0
protocol mqtt

# TLS Configuration
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

# ---------------------------------------------------
# Secondary Listener: Secure WebSockets (Port 9001)
# ---------------------------------------------------
listener 9001 0.0.0.0
protocol websockets

# TLS Configuration for WebSockets
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
